[project]
name = "brightloop-backend"
version = "0.1.0"
description = "Brightloop Subscription Management System - API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.44,<2.1",
    "alembic>=1.17",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "tzdata>=2025.2",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
# Supply-chain policy: never resolve a release younger than ~2 weeks.
exclude-newer = "2026-10-17T00:00:00Z"
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
